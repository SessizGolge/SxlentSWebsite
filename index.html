<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/favicon512.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.7">
  <link rel="stylesheet" href="css/about.css?v=1.0.7">
  <link rel="stylesheet" href="css/musicPlayer.css?v=2.0.1">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<body>

<!-- Background Canvas & Scanlines -->
<canvas id="bgCanvas"></canvas>
<div class="scanlines" aria-hidden="true"></div>

<!-- Main App -->
<div id="app">

  <header class="header">
    <div class="header-left">
      <img src="images/favicon64.png" alt="logo" class="hero-icon">
      <div class="logo">Home</div>
    </div>
  </header>

  <section class="hero">
    <h1 class="home-title"></h1>
    <p class="home-subtitle"></p>

    <p class="site-description">
      Welcome to my creative space. Here you'll find my latest projects, thoughts, and updates on music, code, and games. 
      Explore my posts to see what I've been working on, or check out more about me.
    </p>

    <div class="hero-buttons">
      <a href="/posts/" class="hero-btn primary">
        📝 Check Posts
      </a>
      <a href="/about/" class="hero-btn">
        👤 About Me
      </a>
    </div>

    <div class="visitor-counter">
      <span id="visitorCount">Loading...</span> users visited
    </div>
  </section>

</div>

<!-- Scripts -->
<script src="js/bgEffect.js?v=1.0.0"></script>
<script src="js/homeScript.js"></script>
<script src="js/visitorTracker.js"></script>
<script src="js/musicPlayer.js?v=1.0.1"></script>

</body>
</html>
